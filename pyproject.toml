[project]
name = "sonae"
version = "0.1.0"
description = "Sonae — an ambient AI agent team that prepares your family for disasters, stands watch over official hazard feeds, and acts when the water rises."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Hironobu Iga" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "pillow>=12.3.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.3",
    "strands-agents>=1.53.0",
    "strands-agents-tools>=0.8.6",
    "uvicorn>=0.52.4",
]

[project.scripts]
sonae = "sonae.cli:main"

[project.optional-dependencies]
agentcore = [
    "bedrock-agentcore>=1.22.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.16.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sonae"]

[tool.ruff]
line-length = 125
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# UP042/UP047: keep (str, Enum) and TypeVar style for Pydantic/py312 compatibility
ignore = ["UP042", "UP047"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
